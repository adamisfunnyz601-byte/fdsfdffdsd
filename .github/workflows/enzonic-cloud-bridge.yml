name: Enzonic Cloud connection check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mobile-notifications-responsive-platforms
    paths:
      - ".github/workflows/enzonic-cloud-bridge.yml"

permissions:
  contents: read

jobs:
  check-enzonic-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Check Enzonic Cloud MCP authentication (read-only)
        env:
          ENZONIC_CLOUD_TOKEN: ${{ secrets.ENZONIC_CLOUD_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://panel.enzonic.com/api/cloud/mcp";
          const token = process.env.ENZONIC_CLOUD_TOKEN;
          if (!token) {
            console.error("Missing GitHub Actions secret: ENZONIC_CLOUD_TOKEN");
            process.exit(1);
          }

          async function rpc(payload, sessionId) {
            const headers = {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json",
              "Accept": "application/json, text/event-stream",
              "MCP-Protocol-Version": "2025-03-26"
            };
            if (sessionId) headers["Mcp-Session-Id"] = sessionId;
            const response = await fetch(endpoint, {
              method: "POST",
              headers,
              body: JSON.stringify(payload)
            });
            const body = await response.text();
            if (!response.ok) {
              console.error(`Enzonic MCP returned HTTP ${response.status}`);
              console.error(body.slice(0, 1200));
              process.exit(1);
            }
            let message;
            try {
              message = JSON.parse(body);
            } catch {
              const dataLine = body.split("\\n").find(line => line.startsWith("data:"));
              if (!dataLine) throw new Error("Enzonic returned an unrecognised MCP response.");
              message = JSON.parse(dataLine.slice(5).trim());
            }
            if (message.error) throw new Error(message.error.message || "MCP request failed");
            return { message, sessionId: response.headers.get("mcp-session-id") || sessionId };
          }

          const init = await rpc({
            jsonrpc: "2.0",
            id: 1,
            method: "initialize",
            params: {
              protocolVersion: "2025-03-26",
              capabilities: {},
              clientInfo: { name: "nexus-github-actions", version: "1.0.0" }
            }
          });

          await rpc({ jsonrpc: "2.0", method: "notifications/initialized" }, init.sessionId);
          const listed = await rpc({
            jsonrpc: "2.0",
            id: 2,
            method: "tools/list",
            params: {}
          }, init.sessionId);

          const tools = listed.message.result?.tools || [];
          console.log(`Authenticated with Enzonic Cloud. ${tools.length} tool(s) are available to this token.`);
          for (const tool of tools) console.log(`- ${tool.name}`);
          console.log("This check only lists permitted tools; it does not change databases or deployments.");
          NODE
