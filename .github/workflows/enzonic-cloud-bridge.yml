name: Enzonic Cloud database setup

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mobile-notifications-responsive-platforms
    paths:
      - ".github/workflows/enzonic-cloud-bridge.yml"

permissions:
  contents: read

jobs:
  inspect-enzonic:
    runs-on: ubuntu-latest
    steps:
      - name: Create Nexus accounts database if missing
        env:
          ENZONIC_CLOUD_TOKEN: ${{ secrets.ENZONIC_CLOUD_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://panel.enzonic.com/api/cloud/mcp";
          const token = process.env.ENZONIC_CLOUD_TOKEN;
          if (!token) throw new Error("Missing ENZONIC_CLOUD_TOKEN GitHub secret.");
          let sessionId;
          async function rpc(payload) {
            const headers = {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
              Accept: "application/json, text/event-stream",
              "MCP-Protocol-Version": "2025-03-26",
              ...(sessionId ? { "Mcp-Session-Id": sessionId } : {})
            };
            const response = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify(payload) });
            const body = await response.text();
            if (!response.ok) throw new Error(`Enzonic HTTP ${response.status}: ${body.slice(0, 1000)}`);
            sessionId = response.headers.get("mcp-session-id") || sessionId;
            if (!body.trim()) return {};
            try { return JSON.parse(body); }
            catch {
              const dataLine = body.split("\n").find(line => line.startsWith("data:"));
              if (!dataLine) throw new Error("Unrecognised MCP response.");
              return JSON.parse(dataLine.slice(5).trim());
            }
          }
          const init = await rpc({
            jsonrpc: "2.0", id: 1, method: "initialize",
            params: { protocolVersion: "2025-03-26", capabilities: {}, clientInfo: { name: "nexus-github-actions", version: "1.2.0" } }
          });
          if (init.error) throw new Error(init.error.message);
          await rpc({ jsonrpc: "2.0", method: "notifications/initialized" });
          const listed = await rpc({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} });
          if (listed.error) throw new Error(listed.error.message);
          const available = new Set((listed.result?.tools || []).map(tool => tool.name));
          for (const name of ["list_databases", "create_database"]) {
            if (!available.has(name)) throw new Error(`Enzonic tool unavailable: ${name}`);
          }
          async function callTool(id, name, args = {}) {
            const response = await rpc({ jsonrpc: "2.0", id, method: "tools/call", params: { name, arguments: args } });
            if (response.error) throw new Error(response.error.message);
            const result = response.result;
            if (result?.isError) throw new Error(JSON.stringify(result.structuredContent || result.content || result));
            return result;
          }
          const existing = await callTool(3, "list_databases", { limit: 100 });
          const databases = existing.structuredContent?.data || [];
          const match = databases.find(db => (db.name || "").toLowerCase() === "nexus accounts");
          if (match) {
            console.log("Nexus Accounts database already exists; skipping creation.");
            console.log(JSON.stringify({ id: match.id, name: match.name, engine: match.engine, status: match.status }, null, 2));
          } else {
            console.log("No Nexus Accounts database found. Creating free PostgreSQL in the US region...");
            const created = await callTool(4, "create_database", {
              name: "Nexus Accounts",
              engine: "postgres",
              region: "us",
              size: "free"
            });
            console.log("Enzonic accepted the database creation request:");
            console.log(JSON.stringify(created.structuredContent || created.content || created, null, 2));
          }
          NODE
