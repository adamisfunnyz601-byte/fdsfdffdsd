name: Retrieve Apple Personal Team ID

on:
  workflow_dispatch:
    inputs:
      challenge_id:
        description: "Challenge ID created in the NEXUS Apple verification popup"
        required: true
        type: string

permissions:
  contents: read

jobs:
  retrieve-team-id:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Authenticate and retrieve Apple Team ID
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          APPLE_2FA_RELAY_SECRET: ${{ secrets.APPLE_2FA_RELAY_SECRET }}
          APPLE_2FA_CHALLENGE_ID: ${{ inputs.challenge_id }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_ID:-}" ]]; then
            echo "::error::Missing APPLE_ID repository secret."
            exit 1
          fi
          if [[ -z "${FASTLANE_PASSWORD:-}" && -z "${FASTLANE_SESSION:-}" ]]; then
            echo "::error::Add FASTLANE_PASSWORD as a repository secret."
            exit 1
          fi
          if [[ -z "${APPLE_2FA_RELAY_SECRET:-}" ]]; then
            echo "::error::Missing APPLE_2FA_RELAY_SECRET repository secret."
            exit 1
          fi
          if [[ ! "${APPLE_2FA_CHALLENGE_ID:-}" =~ ^[A-Za-z0-9_-]{32}$ ]]; then
            echo "::error::Invalid challenge ID. Create a fresh challenge in NEXUS."
            exit 1
          fi

          echo "::add-mask::${APPLE_2FA_RELAY_SECRET}"

          ruby <<'RUBY'
          require "spaceship"
          require "net/http"
          require "json"
          require "uri"

          module Spaceship
            class Client
              def ask_for_2fa_code(_prompt)
                challenge_id = ENV.fetch("APPLE_2FA_CHALLENGE_ID")
                secret = ENV.fetch("APPLE_2FA_RELAY_SECRET")
                uri = URI("https://nexus-api-rcmi.onrender.com/api/internal/apple-auth/#{challenge_id}/poll")
                deadline = Time.now + 240

                puts "Waiting for the verification code in your NEXUS popup..."
                loop do
                  raise "Timed out waiting for the NEXUS verification code." if Time.now >= deadline

                  request = Net::HTTP::Post.new(uri)
                  request["Authorization"] = "Bearer #{secret}"
                  request["Content-Type"] = "application/json"
                  response = Net::HTTP.start(uri.host, uri.port, use_ssl: true, open_timeout: 10, read_timeout: 15) do |http|
                    http.request(request)
                  end

                  case response.code.to_i
                  when 200
                    code = JSON.parse(response.body).fetch("code").to_s
                    raise "NEXUS returned an invalid verification code." unless code.match?(/\A[0-9]{4,8}\z/)
                    puts "::add-mask::#{code}"
                    puts "Verification code received securely."
                    return code
                  when 202
                    sleep 3
                  else
                    raise "NEXUS verification relay returned HTTP #{response.code}."
                  end
                end
              end
            end
          end

          begin
            puts "Signing in to Apple Developer Portal..."
            password = ENV["FASTLANE_PASSWORD"].to_s
            client = if password.empty?
              Spaceship::Portal.login(ENV.fetch("APPLE_ID"))
            else
              Spaceship::Portal.login(ENV.fetch("APPLE_ID"), password)
            end

            teams = client.teams
            if teams.empty?
              abort "Apple returned no Developer Portal teams. The free Personal Team may not be provisioned for this account."
            end

            found = false
            teams.each do |team|
              team_id = team["teamId"]
              next if team_id.to_s.empty?

              found = true
              name = team["name"] || "Unnamed team"
              type = team["type"] || "Team"
              puts "#{name} (#{type}): #{team_id}"

              File.open(ENV.fetch("GITHUB_STEP_SUMMARY"), "a") do |summary|
                summary.puts "### Apple Developer Team"
                summary.puts "- Name: #{name}"
                summary.puts "- Type: #{type}"
                summary.puts "- **Team ID: `#{team_id}`**"
              end
            end

            abort "Apple returned no Team IDs." unless found
          rescue => error
            warn "Apple sign-in or team lookup failed (#{error.class}). Check the credentials and create a fresh verification challenge."
            exit 1
          end
          RUBY
