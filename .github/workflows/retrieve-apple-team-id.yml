name: Retrieve Apple Personal Team ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-team-id:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Authenticate and retrieve Apple Team ID
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          APPLE_2FA_CODE: ${{ secrets.APPLE_2FA_CODE }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail

          # Mask the short-lived code before any command can print it.
          if [[ -n "${APPLE_2FA_CODE:-}" ]]; then
            echo "::add-mask::${APPLE_2FA_CODE}"
          fi

          if [[ -z "${APPLE_ID:-}" ]]; then
            echo "::error::Missing APPLE_ID repository secret."
            exit 1
          fi

          if [[ -z "${FASTLANE_PASSWORD:-}" && -z "${FASTLANE_SESSION:-}" ]]; then
            echo "::error::Add FASTLANE_PASSWORD or FASTLANE_SESSION as a repository secret."
            exit 1
          fi

          if [[ ! "${APPLE_2FA_CODE:-}" =~ ^[0-9]{4,6}$ ]]; then
            echo "::error::Add a fresh 4–6 digit code as the temporary APPLE_2FA_CODE repository secret, then rerun."
            exit 1
          fi

          ruby <<'RUBY'
          require "spaceship"

          # Supply the one-time code when Spaceship requests its 2FA challenge.
          module Spaceship
            class Client
              def ask_for_2fa_code(_prompt)
                ENV.fetch("APPLE_2FA_CODE")
              end
            end
          end

          begin
            puts "Signing in to Apple Developer Portal..."
            password = ENV["FASTLANE_PASSWORD"].to_s
            client = if password.empty?
              Spaceship::Portal.login(ENV.fetch("APPLE_ID"))
            else
              Spaceship::Portal.login(ENV.fetch("APPLE_ID"), password)
            end

            teams = client.teams
            if teams.empty?
              abort "Apple returned no Developer Portal teams. The free Personal Team may not be provisioned for this account."
            end

            found = false
            teams.each do |team|
              team_id = team["teamId"]
              next if team_id.to_s.empty?

              found = true
              name = team["name"] || "Unnamed team"
              type = team["type"] || "Team"
              puts "#{name} (#{type}): #{team_id}"

              File.open(ENV.fetch("GITHUB_STEP_SUMMARY"), "a") do |summary|
                summary.puts "### Apple Developer Team"
                summary.puts "- Name: #{name}"
                summary.puts "- Type: #{type}"
                summary.puts "- **Team ID: `#{team_id}`**"
              end
            end

            abort "Apple returned no Team IDs." unless found
          rescue => error
            warn "Apple sign-in or team lookup failed (#{error.class}). Check the credentials and use a fresh verification code."
            exit 1
          end
          RUBY
