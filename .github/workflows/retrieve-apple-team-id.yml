# Apple Personal Team ID lookup workflow
name: Retrieve Apple Personal Team ID

on:
  workflow_dispatch:
    inputs:
      apple_2fa_code:
        description: "Optional fresh 2FA code from a trusted Apple device (4–6 digits)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  retrieve-team-id:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane Spaceship
        run: gem install fastlane --no-document

      - name: Retrieve Apple teams
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          APPLE_2FA_CODE: ${{ inputs.apple_2fa_code }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_ID:-}" ]]; then
            echo "::error::Add APPLE_ID in repository Actions secrets."
            exit 1
          fi

          if [[ -z "${FASTLANE_SESSION:-}" && -z "${FASTLANE_PASSWORD:-}" ]]; then
            echo "::error::Add FASTLANE_PASSWORD or FASTLANE_SESSION in repository Actions secrets."
            exit 1
          fi

          ruby <<'RUBY'
          require "spaceship"

          # Allow a one-time code generated before starting this workflow to
          # satisfy Fastlane's otherwise-interactive 2FA prompt.
          module Spaceship
            class Client
              def ask_for_2fa_code(prompt)
                code = ENV["APPLE_2FA_CODE"].to_s.strip
                unless code.match?(/\\A\\d{4,6}\\z/)
                  raise "Apple requested 2FA, but no valid 4–6 digit APPLE_2FA_CODE was supplied. Generate a fresh code on a trusted Apple device and rerun."
                end
                puts "Using the one-time 2FA code supplied for this workflow run."
                code
              end
            end
          end

          begin
            password = ENV["FASTLANE_PASSWORD"]
            client = if password && !password.empty?
              Spaceship::Portal.login(ENV.fetch("APPLE_ID"), password)
            else
              Spaceship::Portal.login(ENV.fetch("APPLE_ID"))
            end
            teams = client.teams

            if teams.empty?
              abort "Apple returned no Developer Portal teams for this account. A free Personal Team may not be provisioned on this account yet."
            end

            puts "Apple Developer teams available to this Apple Account:"
            teams.each do |team|
              name = team["name"] || "Unnamed team"
              kind = team["type"] || "Team"
              team_id = team["teamId"]
              next if team_id.to_s.empty?

              puts "- #{name} (#{kind}): #{team_id}"
              File.open(ENV.fetch("GITHUB_STEP_SUMMARY"), "a") do |summary|
                summary.puts "- **#{name}** (#{kind}): `#{team_id}`"
              end
            end
          rescue => error
            warn "Could not retrieve Apple teams. Check the Apple sign-in, 2FA code, and any saved Fastlane session."
            warn "Error class: #{error.class}"
            exit 1
          end
          RUBY
