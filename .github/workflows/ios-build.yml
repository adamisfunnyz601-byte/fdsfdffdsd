name: Build iOS archive

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS URL of the deployed NEXUS web app"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment URL
        env:
          APP_URL: ${{ inputs.server_url }}
        run: |
          node -e 'const u=new URL(process.env.APP_URL); if(u.protocol!=="https:") throw new Error("server_url must use HTTPS");'
      - name: Install app dependencies
        run: npm ci
      - name: Install Capacitor build tooling
        run: npm install --no-save --package-lock=false @capacitor/cli@^8 @capacitor/core@^8 @capacitor/ios@^8
      - name: Build web application
        run: npm run build
      - name: Generate Xcode project
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath "$PWD/NEXUS.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - name: Upload Xcode project and archive
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ios-unsigned-archive
          path: |
            NEXUS.xcarchive
            ios/
          if-no-files-found: error
          retention-days: 14
