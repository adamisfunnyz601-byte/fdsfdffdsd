name: Build iOS archive

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS URL of the deployed NEXUS web app"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    env:
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment URL
        env:
          APP_URL: ${{ inputs.server_url }}
        run: |
          node -e 'const u=new URL(process.env.APP_URL); if(u.protocol!=="https:") throw new Error("server_url must use HTTPS");'
      - name: Install app dependencies
        run: npm install
      - name: Install Capacitor build tooling
        run: npm install --no-save --package-lock=false @capacitor/cli@^8 @capacitor/core@^8 @capacitor/ios@^8 @capacitor/push-notifications@^8 @capacitor/local-notifications@^8
      - name: Build web application
        run: npm run build
      - name: Generate Xcode project
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Add iOS microphone usage description and audio background mode
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("ios/App/App/Info.plist")
          data = plistlib.loads(path.read_bytes())
          data["NSMicrophoneUsageDescription"] = "NEXUS uses your microphone for voice calls."
          modes = set(data.get("UIBackgroundModes", []))
          modes.add("audio")
          data["UIBackgroundModes"] = sorted(modes)
          path.write_bytes(plistlib.dumps(data))
          PY
      - name: Configure Firebase and remote notification background mode (optional)
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("ios/App/App/Info.plist")
          data = plistlib.loads(path.read_bytes())
          modes = set(data.get("UIBackgroundModes", []))
          modes.add("remote-notification")
          data["UIBackgroundModes"] = sorted(modes)
          path.write_bytes(plistlib.dumps(data))
          PY
      - name: Build unsigned iOS archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath "$PWD/NEXUS.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - name: Import Apple signing certificate and provisioning profile
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/nexus-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Configure iOS push entitlement for signed build
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          PLIST
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ios/App/App.xcodeproj/project.pbxproj")
          text = path.read_text()
          text = text.replace("PRODUCT_BUNDLE_IDENTIFIER = com.nexusos.app;", "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" + chr(10) + "                PRODUCT_BUNDLE_IDENTIFIER = com.nexusos.app;")
          path.write_text(text)
          PY
      - name: Archive signed iOS app
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath "$PWD/NEXUS-Signed.xcarchive" archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
      - name: Export installable IPA
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.nexusos.app</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/NEXUS-Signed.xcarchive" -exportPath "$PWD/ios-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload Xcode project, archive and IPA

        uses: actions/upload-artifact@v4
        with:
          name: nexus-ios-build
          path: |
            NEXUS.xcarchive
            NEXUS-Signed.xcarchive
            ios/
            ios-export/*.ipa
          if-no-files-found: error
          retention-days: 14
