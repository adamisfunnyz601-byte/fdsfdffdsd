name: Build bundled NEXUS iOS app

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mobile-notifications-responsive-platforms
    paths:
      - ".github/workflows/ios-build.yml"
      - "client/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "script/build.ts"

permissions:
  contents: write

jobs:
  ios-bundled:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build the exact NEXUS website frontend
        run: |
          npm run build
          test -s dist/public/index.html
          test -d dist/public/assets
          echo "Bundled website assets:"
          du -sh dist/public
      - name: Generate Capacitor iOS project and copy website assets locally
        run: |
          npx cap add ios
          npx cap sync ios
          # Allow the bundled WKWebView to use the Render API host for its
          # authenticated native requests and session cookies.
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:0 string nexuss.devs.li" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :WKAppBoundDomains" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string NEXUS uses the camera for video calls and profile features." ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription NEXUS uses the camera for video calls and profile features." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string NEXUS uses the microphone for voice and video calls." ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription NEXUS uses the microphone for voice and video calls." ios/App/App/Info.plist
          # WebRTC calls must remain an active audio session when the app is backgrounded.
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" ios/App/App/Info.plist
          test -s ios/App/App/public/index.html
          test -d ios/App/App/public/assets
          echo "iOS-bundled frontend:"
          du -sh ios/App/App/public
          test -d ios/App/App.xcodeproj
      - name: Embed native CallKit integration for iOS system call indicator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_delegate = Path("ios/App/App/AppDelegate.swift")
          if not app_delegate.exists():
              raise SystemExit("Capacitor AppDelegate.swift was not generated")
          source = app_delegate.read_text()
          if "NexusCallKitPlugin" not in source:
              source = source.replace("import Capacitor", "import Capacitor\nimport CallKit\nimport AVFoundation", 1)
              launch = re.search(r"(func application\([^)]*didFinishLaunchingWithOptions[^)]*\)\s*->\s*Bool\s*\{)", source)
              if not launch:
                  raise SystemExit("Could not find AppDelegate launch method to register CallKit")
              insertion = """
                  DispatchQueue.main.async {
                      if let bridgeViewController = self.window?.rootViewController as? CAPBridgeViewController {
                          bridgeViewController.bridge?.registerPluginInstance(NexusCallKitPlugin())
                      }
                  }
              """
              source = source[:launch.end()] + insertion + source[launch.end():]
              source += r'''

          @objc(NexusCallKitPlugin)
          public class NexusCallKitPlugin: CAPPlugin, CAPBridgedPlugin, CXProviderDelegate {
              public let identifier = "NexusCallKitPlugin"
              public let jsName = "NexusCallKit"
              public let pluginMethods: [CAPPluginMethod] = [
                  CAPPluginMethod(name: "start", returnType: CAPPluginReturnPromise),
                  CAPPluginMethod(name: "stop", returnType: CAPPluginReturnPromise)
              ]

              private let callProvider = CXProvider(configuration: {
                  let config = CXProviderConfiguration(localizedName: "NEXUS")
                  config.supportsVideo = true
                  config.maximumCallsPerCallGroup = 1
                  config.maximumCallGroups = 1
                  config.supportedHandleTypes = [.generic]
                  return config
              }())
              private let callController = CXCallController()
              private var activeCallUUID: UUID?

              public override func load() {
                  callProvider.setDelegate(self, queue: nil)
              }

              @objc public func start(_ call: CAPPluginCall) {
                  guard activeCallUUID == nil else {
                      call.resolve()
                      return
                  }
                  let uuid = UUID()
                  let displayName = call.getString("name") ?? "NEXUS call"
                  activeCallUUID = uuid
                  let handle = CXHandle(type: .generic, value: displayName)
                  let action = CXStartCallAction(call: uuid, handle: handle)
                  action.isVideo = false
                  callController.request(CXTransaction(action: action)) { [weak self] error in
                      guard let self = self else { return }
                      if let error = error {
                          self.activeCallUUID = nil
                          call.reject("Could not start the iOS system call indicator: \(error.localizedDescription)")
                          return
                      }
                      self.callProvider.reportOutgoingCall(with: uuid, startedConnectingAt: Date())
                      self.callProvider.reportOutgoingCall(with: uuid, connectedAt: Date())
                      call.resolve()
                  }
              }

              @objc public func stop(_ call: CAPPluginCall) {
                  guard let uuid = activeCallUUID else {
                      call.resolve()
                      return
                  }
                  let action = CXEndCallAction(call: uuid)
                  callController.request(CXTransaction(action: action)) { [weak self] error in
                      guard let self = self else { return }
                      self.callProvider.reportCall(with: uuid, endedAt: Date(), reason: .remoteEnded)
                      self.activeCallUUID = nil
                      try? AVAudioSession.sharedInstance().setActive(false, options: .notifyOthersOnDeactivation)
                      if let error = error {
                          call.reject("Could not close the iOS system call indicator: \\(error.localizedDescription)")
                      } else {
                          call.resolve()
                      }
                  }
              }

              public func provider(_ provider: CXProvider, perform action: CXStartCallAction) {
                  do {
                      let audio = AVAudioSession.sharedInstance()
                      try audio.setCategory(.playAndRecord, mode: .voiceChat, options: [.allowBluetooth, .defaultToSpeaker])
                      try audio.setActive(true)
                      action.fulfill()
                  } catch {
                      action.fail()
                  }
              }

              public func provider(_ provider: CXProvider, perform action: CXEndCallAction) {
                  try? AVAudioSession.sharedInstance().setActive(false, options: .notifyOthersOnDeactivation)
                  activeCallUUID = nil
                  action.fulfill()
              }

              public func providerDidReset(_ provider: CXProvider) {
                  activeCallUUID = nil
                  try? AVAudioSession.sharedInstance().setActive(false, options: .notifyOthersOnDeactivation)
              }
          }
          '''
              app_delegate.write_text(source)
          print("Embedded and registered NEXUS CallKit plugin in AppDelegate.swift")
          PY
      - name: Install the original NEXUS galaxy shield app icon
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          cat > "$RUNNER_TEMP/render-nexus-icon.swift" <<'SWIFT'
          import AppKit
          import Foundation
          let source = URL(fileURLWithPath: "client/public/nexus-icon.svg")
          let destination = URL(fileURLWithPath: CommandLine.arguments[1])
          guard let image = NSImage(contentsOf: source) else { fatalError("Could not load NEXUS SVG icon") }
          let size = NSSize(width: 1024, height: 1024)
          let bitmap = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: 1024, pixelsHigh: 1024, bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true, isPlanar: false, colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0)!
          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: bitmap)
          image.draw(in: NSRect(origin: .zero, size: size), from: .zero, operation: .copy, fraction: 1)
          NSGraphicsContext.restoreGraphicsState()
          guard let png = bitmap.representation(using: .png, properties: [:]) else { fatalError("Could not encode NEXUS icon PNG") }
          try png.write(to: destination)
          SWIFT
          swift "$RUNNER_TEMP/render-nexus-icon.swift" "$ICON_DIR/AppIcon.png"
          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON
          test -s "$ICON_DIR/AppIcon.png"
          echo "Installed original NEXUS galaxy shield icon:"
          sips -g pixelWidth -g pixelHeight "$ICON_DIR/AppIcon.png"
      - name: Build unsigned iOS archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath "$PWD/NEXUS.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/NEXUS.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/public/index.html"
          test -d "$APP_PATH/public/assets"
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/unsigned-ipa/Payload/NEXUS.app"
          (cd "$RUNNER_TEMP/unsigned-ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/NEXUS-website-bundled.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/NEXUS-website-bundled.ipa"
          echo "IPA size: $(du -h "$GITHUB_WORKSPACE/NEXUS-website-bundled.ipa" | cut -f1)"
          unzip -l "$GITHUB_WORKSPACE/NEXUS-website-bundled.ipa" | grep -E 'Payload/NEXUS.app/public/(index.html|assets/)'
      - name: Upload bundled iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: nexus-website-bundled-unsigned-ipa
          path: NEXUS-website-bundled.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish directly downloadable IPA release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-ios-${{ github.run_number }}-${{ github.run_attempt }}
          name: NEXUS iOS ${{ github.run_number }}
          body: Unsigned iOS IPA build from commit ${{ github.sha }}. Requires signing before installation.
          prerelease: true
          files: NEXUS-website-bundled.ipa
          fail_on_unmatched_files: true
