name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS URL of the deployed NEXUS web app"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    env:
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment URL
        env:
          APP_URL: ${{ inputs.server_url }}
        run: |
          node -e 'const u=new URL(process.env.APP_URL); if(u.protocol!=="https:") throw new Error("server_url must use HTTPS");'
      - name: Install app dependencies
        run: npm install
      - name: Install Capacitor build tooling
        run: npm install --no-save --package-lock=false @capacitor/cli@^8 @capacitor/core@^8 @capacitor/ios@^8 @capacitor/push-notifications@^8 @capacitor/local-notifications@^8
      - name: Build web application
        run: npm run build
      - name: Generate Xcode project
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Add iOS microphone usage description and audio background mode
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("ios/App/App/Info.plist")
          data = plistlib.loads(path.read_bytes())
          data["NSMicrophoneUsageDescription"] = "NEXUS uses your microphone for voice calls."
          modes = set(data.get("UIBackgroundModes", []))
          modes.add("audio")
          data["UIBackgroundModes"] = sorted(modes)
          path.write_bytes(plistlib.dumps(data))
          PY
      - name: Configure Firebase and remote notification background mode (optional)
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("ios/App/App/Info.plist")
          data = plistlib.loads(path.read_bytes())
          modes = set(data.get("UIBackgroundModes", []))
          modes.add("remote-notification")
          data["UIBackgroundModes"] = sorted(modes)
          path.write_bytes(plistlib.dumps(data))
          PY
      - name: Build unsigned iOS archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath "$PWD/NEXUS.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/NEXUS.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/unsigned-ipa/Payload/App.app"
          (cd "$RUNNER_TEMP/unsigned-ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/NEXUS-unsigned.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/NEXUS-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ios-unsigned-ipa
          path: |
            NEXUS-unsigned.ipa
            NEXUS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
