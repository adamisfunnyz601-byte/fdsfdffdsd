name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mobile-notifications-responsive-platforms
    paths:
      - ".github/workflows/android-build.yml"
      - "capacitor.config.ts"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "script/**"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pin stable npm version
        run: |
          npm install --global npm@10.9.4
          npm --version
      - name: Install app dependencies (resilient)
        shell: bash
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          # The checked-in lockfile contains Replit-only mirror URLs and predates
          # the Capacitor dependencies. Ignore it in CI rather than fetching from
          # a private mirror or failing on an out-of-sync lockfile.
          for attempt in 1 2 3; do
            if npm install --package-lock=false --no-audit --no-fund --prefer-online --maxsockets=5; then
              exit 0
            fi
            echo "npm install failed (attempt $attempt/3); clearing npm's cache and retrying..."
            npm cache clean --force || true
            sleep 5
          done
          echo "Dependency installation failed after 3 attempts."
          exit 1
      - name: Type-check all TypeScript and TSX sources
        run: npm run check
      - name: Build web application
        run: npm run build

      - name: Verify the complete local NEXUS UI bundle
        run: |
          test -s dist/public/index.html
          find dist/public/assets -maxdepth 1 -type f -name '*.js' | grep -q .
          grep -Eq '/assets/[^"]+\.js' dist/public/index.html
      - name: Generate Android Studio project with bundled local website
        run: |
          npx cap add android
          npx cap sync android
      - name: Add Android microphone and notification permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
          ]
          for permission in permissions:
              if permission not in xml:
                  xml = xml.replace("<application", f'  <uses-permission android:name="{permission}" />\n  <application', 1)
          path.write_text(xml)
          PY
      - name: Add native microphone foreground call service
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          permissions = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.WAKE_LOCK",
              "android.permission.POST_NOTIFICATIONS",
          ]
          for permission in permissions:
              if permission not in xml:
                  xml = xml.replace("<application", f'    <uses-permission android:name="{permission}" />\n    <application', 1)
          service = '''
              <service
                  android:name=".CallAudioService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="microphone" />
          '''
          if "CallAudioService" not in xml:
              xml = xml.replace("</application>", service + "\n    </application>")
          manifest.write_text(xml)

          main = next(Path("android/app/src/main").rglob("MainActivity.java"), None)
          if main is None:
              raise SystemExit("Generated Capacitor MainActivity.java not found")
          source = main.read_text()
          package = re.search(r"^package ([\w.]+);", source, re.M)
          if not package:
              raise SystemExit("Could not detect Android package name")
          package_name = package.group(1)
          if "CallAudioPlugin.class" not in source:
              source = source.replace("import com.getcapacitor.BridgeActivity;", "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\nimport " + package_name + ".CallAudioPlugin;")
              source = source.replace("public class MainActivity extends BridgeActivity {}", """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(CallAudioPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }""")
              main.write_text(source)

          java_dir = main.parent
          (java_dir / "CallAudioPlugin.java").write_text("""package PACKAGE_NAME;

          import android.content.Intent;
          import android.os.Build;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "CallAudio")
          public class CallAudioPlugin extends Plugin {
              @PluginMethod
              public void start(PluginCall call) {
                  try {
                      Intent intent = new Intent(getContext(), CallAudioService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) getContext().startForegroundService(intent);
                      else getContext().startService(intent);
                      call.resolve();
                  } catch (Exception error) {
                      call.reject("Could not start background call service: " + error.getMessage(), error);
                  }
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  getContext().stopService(new Intent(getContext(), CallAudioService.class));
                  call.resolve();
              }
          }
          """.replace("PACKAGE_NAME", package_name))

          (java_dir / "CallAudioService.java").write_text("""package PACKAGE_NAME;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          public class CallAudioService extends Service {
              private static final String CHANNEL_ID = "nexus_active_calls";
              private static final int NOTIFICATION_ID = 6402;

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "Active calls", NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Keeps an active NEXUS call connected while you use other apps.");
                      getSystemService(NotificationManager.class).createNotificationChannel(channel);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Intent launch = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  PendingIntent pending = launch == null ? null : PendingIntent.getActivity(
                      this, 6402, launch,
                      PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0)
                  );
                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, CHANNEL_ID)
                      : new Notification.Builder(this);
                  builder.setSmallIcon(android.R.drawable.sym_call_incoming)
                      .setContentTitle("NEXUS call in progress")
                      .setContentText("Your call stays connected while you use other apps.")
                      .setCategory(Notification.CATEGORY_CALL)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true);
                  if (pending != null) builder.setContentIntent(pending);
                  Notification notification = builder.build();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(NOTIFICATION_ID, notification);
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  stopForeground(true);
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          """.replace("PACKAGE_NAME", package_name))
          print("Installed native microphone foreground service in", java_dir)
          PY
      - name: Configure Firebase Cloud Messaging (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          app = Path("android/app/build.gradle")
          text = app.read_text()
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(text)
          root = Path("android/build.gradle")
          text = root.read_text()
          if "com.google.gms:google-services" not in text:
              text = text.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
              root.write_text(text)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK and Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/
          if-no-files-found: error
          retention-days: 14

# Rebuild latest NEXUS source after the WebAuthn TypeScript fix.
