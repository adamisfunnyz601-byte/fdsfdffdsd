name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS URL of the deployed NEXUS web app (for example https://nexus.example.com)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate deployment URL
        env:
          APP_URL: ${{ inputs.server_url }}
        run: |
          node -e 'const u=new URL(process.env.APP_URL); if(u.protocol!=="https:") throw new Error("server_url must use HTTPS");'
      - name: Install app dependencies
        run: npm install
      - name: Install Capacitor build tooling
        run: npm install --no-save --package-lock=false @capacitor/cli@^8 @capacitor/core@^8 @capacitor/android@^8 @capacitor/push-notifications@^8 @capacitor/local-notifications@^8
      - name: Build web application
        run: npm run build
      - name: Generate Android Studio project
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
        run: |
          npx cap add android
          npx cap sync android
      - name: Add Android microphone and notification permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          permissions = '  <uses-permission android:name="android.permission.RECORD_AUDIO" />\n  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          if "android.permission.RECORD_AUDIO" not in xml:
              xml = xml.replace("<application", permissions + "  <application", 1)
              path.write_text(xml)
          PY
      - name: Configure Firebase Cloud Messaging (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          app = Path("android/app/build.gradle")
          text = app.read_text()
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(text)
          root = Path("android/build.gradle")
          text = root.read_text()
          if "com.google.gms:google-services" not in text:
              text = text.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
              root.write_text(text)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK and Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/
          if-no-files-found: error
          retention-days: 14
