name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS URL of the deployed NEXUS web app (for example https://nexus.example.com)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate deployment URL
        env:
          APP_URL: ${{ inputs.server_url }}
        run: |
          node -e 'const u=new URL(process.env.APP_URL); if(u.protocol!=="https:") throw new Error("server_url must use HTTPS");'
      - name: Install app dependencies
        run: npm ci
      - name: Install Capacitor build tooling
        run: npm install --no-save --package-lock=false @capacitor/cli@^8 @capacitor/core@^8 @capacitor/android@^8
      - name: Build web application
        run: npm run build
      - name: Generate Android Studio project
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK and Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/
          if-no-files-found: error
          retention-days: 14
