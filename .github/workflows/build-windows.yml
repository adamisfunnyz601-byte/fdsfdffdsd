name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "electron/**"
      - "client/**"
      - "client/src/lib/api-url.ts"
      - "client/src/index.css"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      # Resolve dependencies from the public registry; the existing lockfile
      # contains environment-specific package URLs.
      - name: Install dependencies from public npm registry
        run: npm install --package-lock=false --include=dev --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Verify required packages and dependency tree
        shell: pwsh
        run: |
          npm ls electron electron-builder debug sharp --depth=0
          node -e "require.resolve('electron'); require.resolve('electron-builder'); require.resolve('debug'); require.resolve('sharp'); console.log('Electron build dependencies are resolvable.')"

      - name: Type-check all TypeScript and TSX sources
        run: npm run check

      - name: Build bundled web interface
        run: npm run build

      - name: Verify the complete local NEXUS UI bundle
        shell: pwsh
        run: |
          if (-not (Test-Path dist/public/index.html)) { throw 'Bundled NEXUS UI is missing.' }
          $scripts = Get-ChildItem dist/public/assets -Filter *.js -File -ErrorAction SilentlyContinue
          if (-not $scripts) { throw 'Bundled NEXUS JavaScript assets are missing.' }
          if (-not (Select-String -Path dist/public/index.html -Pattern '/assets/.*\.js' -Quiet)) { throw 'The app entry HTML does not reference its bundled JavaScript.' }

      - name: Generate Windows icon from the iOS app artwork
        shell: pwsh
        run: |
          $script = @'
          import sharp from "sharp";
          import { mkdir, writeFile } from "node:fs/promises";
          const png = await sharp("client/public/nexus-icon.svg").resize(1024, 1024).png().toBuffer();
          const header = Buffer.alloc(22);
          header.writeUInt16LE(0, 0); // reserved
          header.writeUInt16LE(1, 2); // icon resource
          header.writeUInt16LE(1, 4); // one image
          header.writeUInt8(0, 6);    // 256px width
          header.writeUInt8(0, 7);    // 256px height
          header.writeUInt8(0, 8);    // palette
          header.writeUInt8(0, 9);    // reserved
          header.writeUInt16LE(1, 10);
          header.writeUInt16LE(32, 12);
          header.writeUInt32LE(png.length, 14);
          header.writeUInt32LE(22, 18);
          await mkdir("build", { recursive: true });
          await writeFile("build/icon.ico", Buffer.concat([header, png]));
          console.log("Created build/icon.ico from the shared NEXUS app artwork.");
          '@
          node --input-type=module -e $script
          if (-not (Test-Path build/icon.ico)) { throw 'Windows app icon was not generated.' }

      - name: Build Windows installer
        run: npm run desktop:dist -- --publish=never

      - name: Verify installer was created
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist-electron -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $installer) { throw "No Windows installer was produced in dist-electron." }
          $installer | ForEach-Object { Write-Host $_.FullName }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-installer
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 14

