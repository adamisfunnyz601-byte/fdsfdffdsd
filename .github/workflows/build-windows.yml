name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "electron/**"
      - "client/**"
      - "client/src/lib/api-url.ts"
      - "client/src/index.css"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      # The existing lockfile contains Replit-internal package URLs and is
      # out of sync with package.json. Resolve cleanly from the public registry.
      - name: Install dependencies from public npm registry
        run: npm install --package-lock=false --include=dev --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Verify required packages and dependency tree
        shell: pwsh
        run: |
          npm ls electron electron-builder debug --depth=0
          node -e "require.resolve('electron'); require.resolve('electron-builder'); require.resolve('debug'); console.log('Electron build dependencies are resolvable.')"

      - name: Type-check all TypeScript and TSX sources
        run: npm run check

      - name: Build bundled web interface
        run: npm run build

      - name: Verify the complete local NEXUS UI bundle
        shell: pwsh
        run: |
          if (-not (Test-Path dist/public/index.html)) { throw 'Bundled NEXUS UI is missing.' }
          $scripts = Get-ChildItem dist/public/assets -Filter *.js -File -ErrorAction SilentlyContinue
          if (-not $scripts) { throw 'Bundled NEXUS JavaScript assets are missing.' }
          if (-not (Select-String -Path dist/public/index.html -Pattern '/assets/.*\.js' -Quiet)) { throw 'The app entry HTML does not reference its bundled JavaScript.' }

      - name: Build Windows installer
        run: npm run desktop:dist -- --publish=never

      - name: Verify installer was created
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist-electron -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $installer) { throw "No Windows installer was produced in dist-electron." }
          $installer | ForEach-Object { Write-Host $_.FullName }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-installer
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 14

# Rebuild latest NEXUS source after the WebAuthn TypeScript fix.

      - name: Publish directly downloadable Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-windows-${{ github.run_number }}-${{ github.run_attempt }}
          name: NEXUS Windows ${{ github.run_number }}
          body: Windows installer built from commit ${{ github.sha }}.
          prerelease: true
          files: dist-electron/*.exe
          fail_on_unmatched_files: true
