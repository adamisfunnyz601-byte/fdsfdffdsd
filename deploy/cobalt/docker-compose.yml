services:
  cobalt-api:
    image: ghcr.io/imputnet/cobalt:10
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - "9000:9000/tcp"
    environment:
      API_URL: "https://cobalt.example.com/"
      API_AUTH_REQUIRED: "1"
      API_KEY_URL: "file:///keys.json"
      RATELIMIT_WINDOW: "60"
      RATELIMIT_MAX: "10"
    volumes:
      - ./keys.json:/keys.json:ro
